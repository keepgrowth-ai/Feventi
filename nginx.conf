# nginx para la SPA. Se procesa con envsubst al arrancar: `${PORT}` lo pone
# Cloud Run.

server {
  listen       ${PORT};
  server_name  _;
  root         /usr/share/nginx/html;

  # Cloud Run ya comprime, pero no todos los tipos. Esto cubre lo que importa:
  # el bundle de JS son ~500 kB en crudo y ~123 kB comprimidos.
  gzip              on;
  gzip_types        text/css application/javascript application/json image/svg+xml;
  gzip_min_length   1024;

  # No anunciar la versión: no cierra ningún agujero, pero tampoco hay motivo
  # para publicar qué versión corre.
  server_tokens off;

  # ── Caché ─────────────────────────────────────────────────────────────────
  #
  # Angular compila con `outputHashing: all`, así que cada archivo lleva el hash
  # de su contenido en el nombre: si cambia, cambia el nombre. Por eso se pueden
  # cachear para siempre — un despliegue nuevo pide URLs distintas.
  location ~* \.(?:js|css|woff2?|png|jpe?g|svg|webp|avif)$ {
    expires    1y;
    add_header Cache-Control "public, immutable";
    try_files  $uri =404;
  }

  # `index.html` es lo contrario: SIEMPRE se revalida. Es el único archivo cuyo
  # nombre no cambia, y es el que apunta a los bundles nuevos. Cachearlo deja a
  # la gente en la versión vieja hasta que su navegador decida lo contrario —
  # con una entrada en la mano, eso es una llamada a soporte.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # ── Cabeceras de seguridad ────────────────────────────────────────────────
  add_header X-Content-Type-Options  "nosniff"        always;
  add_header X-Frame-Options         "DENY"           always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
  # La cámara la usa el validador de puerta (006); el resto se deniega.
  add_header Permissions-Policy      "camera=(self), microphone=(), geolocation=(), payment=()" always;

  # ── El enrutado ───────────────────────────────────────────────────────────
  #
  # `/eventos/k-pop-fest-2026` no es un archivo: es una ruta de Angular. Sin este
  # fallback, recargar la página o abrir un enlace compartido da 404 — que es el
  # bug clásico de una SPA recién desplegada, y solo aparece al navegar directo,
  # no al hacer clic dentro de la app.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cloud Run comprueba la salud pidiendo `/`, que ya responde. Este endpoint
  # existe para poder distinguir «el contenedor vive» de «la app carga» sin
  # descargar el bundle entero.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
