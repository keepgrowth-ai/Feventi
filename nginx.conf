# nginx para la SPA. Se procesa con envsubst al arrancar: `${PORT}` lo pone
# Cloud Run.

server {
  listen       ${PORT};
  server_name  _;
  root         /usr/share/nginx/html;

  # Cloud Run ya comprime, pero no todos los tipos. Esto cubre lo que importa:
  # el bundle de JS son ~500 kB en crudo y ~123 kB comprimidos.
  gzip              on;
  gzip_types        text/css application/javascript application/json image/svg+xml;
  gzip_min_length   1024;

  # No anunciar la versión: no cierra ningún agujero, pero tampoco hay motivo
  # para publicar qué versión corre.
  server_tokens off;

  # ── Cabeceras de seguridad ────────────────────────────────────────────────
  #
  # OJO, y esto costó un despliegue descubrirlo: en nginx, **un `add_header`
  # dentro de un `location` ANULA todos los del nivel superior**. No se suman.
  # Estos cuatro estaban solo aquí y desaparecían en cuanto la respuesta salía
  # por un location con su propio `add_header` — que es el caso de todo el HTML
  # y de todos los bundles. Se comprobó pidiendo la raíz: llegaba el
  # `Cache-Control` del location y ninguna de las cabeceras de seguridad.
  #
  # `always` NO arregla esto: eso solo hace que la cabecera se emita también en
  # respuestas de error. La herencia es lo que se rompe, y la única salida es
  # repetirlas en cada location que declare las suyas — por eso están abajo.
  #
  # Un `include` con las cuatro sería más limpio de mantener, pero obligaría a
  # un archivo más en la imagen y a acordarse de copiarlo. Con dos locations,
  # repetirlas se lee mejor de lo que se factoriza.
  add_header X-Content-Type-Options  "nosniff"        always;
  add_header X-Frame-Options         "DENY"           always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
  # La cámara la usa el validador de puerta (006); el resto se deniega.
  add_header Permissions-Policy      "camera=(self), microphone=(), geolocation=(), payment=()" always;

  # ── Caché ─────────────────────────────────────────────────────────────────
  #
  # Angular compila con `outputHashing: all`, así que cada archivo lleva el hash
  # de su contenido en el nombre: si cambia, cambia el nombre. Por eso se pueden
  # cachear para siempre — un despliegue nuevo pide URLs distintas.
  location ~* \.(?:js|css|woff2?|png|jpe?g|svg|webp|avif)$ {
    expires    1y;
    add_header Cache-Control           "public, immutable";
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "DENY"           always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(self), microphone=(), geolocation=(), payment=()" always;
    try_files  $uri =404;
  }

  # `index.html` es lo contrario: SIEMPRE se revalida. Es el único archivo cuyo
  # nombre no cambia, y es el que apunta a los bundles nuevos. Cachearlo deja a
  # la gente en la versión vieja hasta que su navegador decida lo contrario —
  # con una entrada en la mano, eso es una llamada a soporte.
  #
  # Aquí entra también todo lo que cae por el `try_files` de abajo: la
  # redirección interna a /index.html vuelve a evaluar los locations.
  location = /index.html {
    add_header Cache-Control           "no-cache, must-revalidate";
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "DENY"           always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(self), microphone=(), geolocation=(), payment=()" always;
  }

  # ── El enrutado ───────────────────────────────────────────────────────────
  #
  # `/eventos/k-pop-fest-2026` no es un archivo: es una ruta de Angular. Sin este
  # fallback, recargar la página o abrir un enlace compartido da 404 — que es el
  # bug clásico de una SPA recién desplegada, y solo aparece al navegar directo,
  # no al hacer clic dentro de la app.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Sin endpoint de salud propio: Cloud Run comprueba el arranque con una sonda
  # TCP al puerto, no con una petición HTTP, y en los logs se ve que pasa
  # («Default STARTUP TCP probe succeeded»). Un `/healthz` aquí solo añadiría una
  # ruta que nadie consulta — de hecho la primera versión lo tenía y devolvía 404
  # desde el frontend de Google, sin llegar siquiera al contenedor.
}
