# Construir y desplegar el front en Cloud Run.
#
# Se usa desde un disparador de Cloud Build conectado al repo. Para un
# despliegue manual basta `gcloud run deploy --source .`, que hace esto mismo
# sin necesitar el archivo.

substitutions:
  _REGION: southamerica-west1
  _SERVICE: feventi-web
  _REPO: feventi

steps:
  # ── Construir ─────────────────────────────────────────────────────────────
  # `--cache-from` reutiliza las capas de la imagen anterior: como el Dockerfile
  # instala dependencias antes de copiar el código, un cambio de código no
  # reinstala node_modules. La diferencia es de minutos por build.
  #
  # El `|| exit 0` del pull es a propósito: la primera vez no hay imagen previa
  # que traer, y sin él ese build fallaría por no encontrar lo que aún no existe.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest || exit 0

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # ── Publicar ──────────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}']

  # ── Desplegar ─────────────────────────────────────────────────────────────
  # Se despliega el tag del COMMIT, no `latest`: así la revisión de Cloud Run
  # queda atada a un sha concreto y un `rollback` sabe exactamente a qué volver.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=10

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
